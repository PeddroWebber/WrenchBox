apiVersion: v1
kind: ConfigMap
metadata:
  name: wrenchbox-config
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Jwt__Issuer: "WrenchBox"
  Jwt__Audience: "WrenchBox.Admin"
  Jwt__ExpiryMinutes: "60"
  Smtp__Host: ""
  Smtp__Port: "1025"
  Smtp__From: "WrenchBox <noreply@wrenchbox.local>"
  Smtp__UseSsl: "false"
  Smtp__PublicBaseUrl: "https://api.wrenchbox.local"
  Swagger__Enabled: "false"
  Seed__Enabled: "false"
  OpenTelemetry__Prometheus__Enabled: "true"
