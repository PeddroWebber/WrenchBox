name: CI/CD

on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  IMAGE_NAME: wrenchbox
  REGISTRY: ghcr.io
  TF_IN_AUTOMATION: "true"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore WrenchBox.sln

      - name: Build
        run: dotnet build WrenchBox.sln --no-restore -c Release

      - name: Test
        run: dotnet test WrenchBox.sln --no-build -c Release --verbosity normal

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate

  kind:
    name: Smoke on Kind
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: wrenchbox
          config: infra/kind-config.yaml
          wait: 120s

      - name: Install metrics-server
        run: kubectl apply -f infra/metrics-server.yaml

      - name: Build local image
        run: docker build -t wrenchbox:latest .

      - name: Load image into Kind
        run: kind load docker-image wrenchbox:latest --name wrenchbox

      - name: Apply local dependencies
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/local/configmap.yaml
          kubectl -n wrenchbox create secret generic wrenchbox-secret \
            --from-literal=Jwt__Secret=WrenchBox_Kind_Secret_Key_Min_32_Chars! \
            --from-literal=Webhook__Secret=dev-webhook-secret \
            --from-literal=ConnectionStrings__Default='Host=postgres;Port=5432;Database=wrenchbox;Username=postgres;Password=postgres' \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/local/postgres-deployment.yaml
          kubectl apply -f k8s/local/mailhog-deployment.yaml

      - name: Wait for PostgreSQL
        run: kubectl -n wrenchbox rollout status deployment/postgres --timeout=180s

      - name: Apply API and HPA
        run: |
          kubectl apply -n wrenchbox -f k8s/api-deployment.yaml
          kubectl apply -n wrenchbox -f k8s/hpa.yaml

      - name: Wait for API
        run: kubectl -n wrenchbox rollout status deployment/wrenchbox-api --timeout=180s

      - name: Smoke health check
        run: |
          kubectl -n wrenchbox wait --for=condition=ready pod -l app=wrenchbox-api --timeout=180s
          API_POD=$(kubectl -n wrenchbox get pod -l app=wrenchbox-api -o jsonpath='{.items[0].metadata.name}')
          kubectl -n wrenchbox exec "$API_POD" -- curl -fsS http://localhost:8080/health

  image:
    name: Build and push Docker image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image metadata
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}

  deploy:
    name: Deploy to AKS
    needs: image
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/homolog')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AKS credentials
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Rollout
        env:
          NAMESPACE: ${{ github.ref_name == 'main' && 'wrenchbox-prod' || 'wrenchbox-homolog' }}
          IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n "$NAMESPACE" -f k8s/configmap.yaml
          kubectl apply -n "$NAMESPACE" -f k8s/api-deployment.yaml
          kubectl apply -n "$NAMESPACE" -f k8s/hpa.yaml
          kubectl -n "$NAMESPACE" set image deployment/wrenchbox-api api="$IMAGE"
          kubectl -n "$NAMESPACE" rollout status deployment/wrenchbox-api --timeout=180s
